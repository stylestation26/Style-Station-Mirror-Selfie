<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Style Station • Garba Mirror</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial,system-ui,sans-serif}
.wrap{max-width:520px;margin:auto;padding:14px}
.card{background:#0c1a2e;border:1px solid #263653;border-radius:22px;padding:18px;min-height:calc(100vh - 28px)}
.logo{width:82px;height:82px;display:block;margin:0 auto 10px;border-radius:50%;object-fit:cover}
h1{text-align:center;font-size:25px;margin:4px 0}
.sub{text-align:center;color:#b9c5d5;font-size:13px;margin:0 0 18px}
.upload{display:block;text-align:center;border:1px dashed #d5ae5f;border-radius:15px;padding:18px 10px;background:#101f35;cursor:pointer}
.upload b{font-size:16px} .upload small{display:block;color:#9eabbc;margin-top:5px}
input{display:none}
.label{font-size:13px;color:#bdc8d7;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{padding:0;border:2px solid transparent;background:none;border-radius:9px;overflow:hidden;aspect-ratio:1/1.3;cursor:pointer}
.grid button.active{border-color:#d5ae5f}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
#create{width:100%;margin-top:15px;border:0;border-radius:13px;padding:14px;background:#d5ae5f;color:#07111f;font-weight:800;font-size:15px;cursor:pointer}
#create:disabled{opacity:.4}
.status{text-align:center;color:#e5cf9a;font-size:12px;margin-top:10px;min-height:18px}
#result{width:100%;display:block;border-radius:14px;margin-top:14px}
.download{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;background:#fff;color:#07111f;font-weight:800;font-size:15px}
.hidden{display:none!important}
.foot{text-align:center;color:#78869a;font-size:11px;margin-top:13px}
</style>
</head>

const LABELS = ['Garba Couple', 'Dandiya', 'Festive Couple', 'Dandiya Night', 'Festive Stage'];
const grid = document.getElementById('grid');
const photo = document.getElementById('photo');
const create = document.getElementById('create');
const status = document.getElementById('status');
const result = document.getElementById('result');
const download = document.getElementById('download');
let selected = 0;
let userImage = null;

BG.forEach((src,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.title=LABELS[i];
  b.className=i===0?'active':'';
  const im=document.createElement('img');
  im.src=src;
  im.alt=LABELS[i];
  b.appendChild(im);
  b.onclick=()=>{
    selected=i;
    [...grid.children].forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
  grid.appendChild(b);
});

photo.addEventListener('change',()=>{
  const f=photo.files && photo.files[0];
  if(!f) return;
  status.textContent='Loading your photo…';
  const r=new FileReader();
  r.onload=()=>{
    userImage=new Image();
    userImage.onload=()=>{
      create.disabled=false;
      status.textContent='Photo ready. Tap CREATE PHOTO.';
    };
    userImage.onerror=()=>{status.textContent='Could not read that photo. Please try JPG or PNG.'};
    userImage.src=r.result;
  };
  r.onerror=()=>{status.textContent='Could not load the photo.'};
  r.readAsDataURL(f);
});

function cover(ctx,img,W,H){
  const s=Math.max(W/img.width,H/img.height);
  const w=img.width*s,h=img.height*s;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}
function fit(ctx,img,x,y,w,h){
  const s=Math.min(w/img.width,h/img.height);
  const iw=img.width*s,ih=img.height*s;
  ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}

create.addEventListener('click',()=>{
  if(!userImage) return;
  create.disabled=true;
  status.textContent='Creating your final Story…';
  try{
    const bg=new Image();
    bg.onload=()=>{
      try{
        const c=document.createElement('canvas');
        const W=1080,H=1920;
        c.width=W;c.height=H;
        const ctx=c.getContext('2d');

        // Garba background
        cover(ctx,bg,W,H);

        // Branding header
        const top=ctx.createLinearGradient(0,0,0,260);
        top.addColorStop(0,'rgba(0,0,0,.72)');
        top.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=top;ctx.fillRect(0,0,W,260);

        ctx.textAlign='center';
        ctx.fillStyle='#fff';
        ctx.font='800 46px Arial';
        ctx.fillText('STYLE STATION',W/2,72);
        ctx.fillStyle='#e6c878';
        ctx.font='600 28px Arial';
        ctx.fillText('GARBA MIRROR',W/2,118);

        // Customer photo frame
        const x=70,y=270,w=940,h=1300;
        ctx.save();
        ctx.fillStyle='rgba(5,15,30,.42)';
        ctx.shadowColor='rgba(0,0,0,.5)';
        ctx.shadowBlur=28;
        ctx.shadowOffsetY=14;
        ctx.beginPath();ctx.roundRect(x,y,w,h,34);ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();ctx.roundRect(x+16,y+16,w-32,h-32,26);ctx.clip();
        fit(ctx,userImage,x+16,y+16,w-32,h-32);
        ctx.restore();

        ctx.strokeStyle='#d5ae5f';
        ctx.lineWidth=6;
        ctx.beginPath();ctx.roundRect(x+16,y+16,w-32,h-32,26);ctx.stroke();

        const bottom=ctx.createLinearGradient(0,1660,0,H);
        bottom.addColorStop(0,'rgba(0,0,0,0)');
        bottom.addColorStop(1,'rgba(0,0,0,.82)');
        ctx.fillStyle=bottom;ctx.fillRect(0,1660,W,260);

        ctx.fillStyle='#fff';
        ctx.font='600 30px Arial';
        ctx.fillText('STYLE FOR EVERY YOU',W/2,1835);

        const url=c.toDataURL('image/jpeg',.88);
        result.src=url;
        result.classList.remove('hidden');
        download.classList.remove('hidden');
        status.textContent='DONE — your Story is ready.';
        create.disabled=false;

        download.onclick=()=>{
          const a=document.createElement('a');
          a.href=url;
          a.download='Style-Station-Garba-Mirror.jpg';
          document.body.appendChild(a);
          a.click();
          a.remove();
        };
      }catch(e){
        console.error(e);
        status.textContent='Could not create the image. Please try another photo.';
        create.disabled=false;
      }
    };
    bg.onerror=()=>{
      status.textContent='Backdrop failed to load. Please refresh once.';
      create.disabled=false;
    };
    bg.src=BG[selected];
  }catch(e){
    status.textContent='Something went wrong. Please try again.';
    create.disabled=false;
  }
});
</script>
